<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"><rect width="760" height="460" rx="18" fill="#f5f8fd"/><text x="380" y="42" text-anchor="middle" fill="#17233c" font-family="Arial" font-size="25" font-weight="bold">Simple hill climbing: first better neighbor</text><text x="380" y="73" text-anchor="middle" fill="#52627a" font-family="Arial" font-size="18">Higher value is better. Inspect neighbors left to right.</text><g stroke-width="4" fill="none"><path d="M380 163 L140 230" stroke="#a3adbf"/><path d="M380 163 L380 230" stroke="#059669"/><path d="M380 163 L620 230" stroke="#a3adbf" stroke-dasharray="9 7"/></g><g font-family="Arial" text-anchor="middle"><rect x="277" y="99" width="206" height="66" rx="12" fill="#1d2b45"/><text x="380" y="126" fill="white" font-size="19">CURRENT STATE</text><text x="380" y="153" fill="white" font-size="25" font-weight="bold">V(current) = 4</text><rect x="50" y="225" width="180" height="87" rx="12" fill="white" stroke="#b9c4d6" stroke-width="2"/><text x="140" y="253" fill="#17233c" font-size="20">1. Neighbor A</text><text x="140" y="283" fill="#17233c" font-size="28" font-weight="bold">3</text><text x="140" y="340" fill="#b91c1c" font-size="21" font-weight="bold">3 &gt; 4? No</text><text x="140" y="367" fill="#52627a" font-size="18">Reject; inspect B</text><rect x="290" y="225" width="180" height="87" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="380" y="253" fill="#17233c" font-size="20">2. Neighbor B</text><text x="380" y="283" fill="#17233c" font-size="28" font-weight="bold">5</text><text x="380" y="340" fill="#047857" font-size="21" font-weight="bold">5 &gt; 4? Yes</text><text x="380" y="367" fill="#047857" font-size="18" font-weight="bold">Move to B; stop scanning</text><rect x="530" y="225" width="180" height="87" rx="12" fill="#edf1f7" stroke="#b9c4d6" stroke-width="2" stroke-dasharray="7 5"/><text x="620" y="253" fill="#52627a" font-size="20">3. Neighbor C</text><text x="620" y="283" fill="#52627a" font-size="28" font-weight="bold">7</text><text x="620" y="340" fill="#52627a" font-size="21">Not inspected</text><text x="620" y="367" fill="#52627a" font-size="18">First improvement is enough</text><text x="380" y="418" fill="#17233c" font-size="21" font-weight="bold">B becomes current. Repeat from B’s neighbors.</text></g></svg>